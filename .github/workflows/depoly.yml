name: Deploy Spring Boot WAR

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 17 설정
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Gradle 실행 권한 부여
      - name: Grant Gradle permission
        run: chmod +x gradlew

      # 4. WAR 빌드
      - name: Build WAR
        run: ./gradlew clean bootWar -x test

      # 5. 실행 가능한 WAR 파일 찾기
      - name: Find WAR file
        run: |
          WAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -name "*.war" \
            ! -name "*-plain.war" \
            | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR 파일을 찾을 수 없습니다."
            ls -al build/libs
            exit 1
          fi

          cp "$WAR_FILE" app.war

      # 6. WAR 파일 EC2 전송
      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOSTS }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEYS }}
          source: app.war
          target: /home/ubuntu/app
          overwrite: true

      # 7. properties 생성 후 애플리케이션 재실행
      - name: Restart application
        uses: appleboy/ssh-action@v1
        env:
          APPLICATION_PROPERTIES: ${{ secrets.APPLICATION_PROPERTIES2 }}
        with:
          host: ${{ secrets.EC2_HOSTS }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEYS }}
          envs: APPLICATION_PROPERTIES

          script: |
            set -e

            APP_DIR="/home/ubuntu/app"
            APP_FILE="$APP_DIR/app.war"
            CONFIG_FILE="$APP_DIR/application.properties"
            LOG_FILE="$APP_DIR/app.log"
            PID_FILE="$APP_DIR/app.pid"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # GitHub Secret으로 application.properties 생성
            printf '%s\n' "$APPLICATION_PROPERTIES" > "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            # 기존 서버 종료
            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE")

              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID"
                sleep 5
              fi

              rm -f "$PID_FILE"
            fi

            # PID 파일이 없거나 종료되지 않은 경우 포트로 종료
            sudo fuser -k -n tcp 8080 || true

            # 새 WAR 실행
            nohup java -jar "$APP_FILE" \
              --spring.config.additional-location="file:$CONFIG_FILE" \
              > "$LOG_FILE" 2>&1 &

            echo $! > "$PID_FILE"

            sleep 10

            # 실행 확인
            if kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "애플리케이션 실행 성공"
              echo "PID: $(cat "$PID_FILE")"
              tail -n 30 "$LOG_FILE"
            else
              echo "애플리케이션 실행 실패"
              tail -n 100 "$LOG_FILE"
              exit 1
            fi